# Lasersite — Render deploy blueprint.
#
# WHY THIS REPOSITORY EXISTS, SEPARATE FROM THE SOURCE
# Render deploys a Blueprint from a git repository you point it at. The Lasersite
# source repository is private — a buyer has the software, not the code — so they
# could never point Render at it. This repository holds the blueprint and nothing
# else, so the browser-only road actually exists for the people who bought it.
#
# WHAT IT DOES
# Render provisions the database, generates the one secret that matters, and
# starts the app. No CLI, no terminal, no connection string typed by hand.
#
# WHAT IT CANNOT DO
# The image is licence-gated, so one thing has to happen first: add your licence
# as a registry credential in your Render workspace. See README.md. A blueprint
# cannot carry your credentials — that is the point of them.
#
# AUTH_SECRET is the SINGLE root secret. ENCRYPTION_KEY, CRON_SECRET and
# INTERNAL_API_KEY are each derived from it, so there is exactly one generated
# value here and no way to forget one of the others.

databases:
  - name: lasersite-db
    databaseName: lasersite
    # NOT the 256 MB plan. Postgres under 256 MB is OOM-killed in a loop, and the
    # symptom does not look like memory: the app reports a connection timeout and
    # the database keeps reporting itself healthy. Costs a little; saves an
    # afternoon of debugging the wrong thing.
    plan: basic-1gb

services:
  - type: web
    name: lasersite
    runtime: image
    image:
      # A PUBLISHED IMAGE, not a build from source. This is what lets a buyer
      # deploy without any access to the repository — distribution and updates
      # become the same mechanism (a release is an image tag).
      #
      # Pin to an exact version rather than :latest. ":latest" means the next
      # restart silently becomes a different version, which is auto-update
      # without the consent, the soak window or the signature check.
      #
      # x-release-please-version — the release workflow rewrites this line.
      url: registry.lasersite.ai/app:0.1.53
      # Your licence, stored once in your Render workspace. Workspace Settings →
      # Registry Credentials → Add, then name it exactly "lasersite".
      creds:
        fromRegistryCreds:
          name: lasersite
    plan: starter
    # Not "/": the homepage returns 200 even when the database is down or a
    # migration failed, so Render could never detect a bad deploy or roll back.
    healthCheckPath: /api/health
    envVars:
      # Provisioned above — you never see a connection string.
      - key: DATABASE_URL
        fromDatabase:
          name: lasersite-db
          property: connectionString

      # Generated BY THE PLATFORM. Never typed, never pasted.
      # Everything else derives from this one value.
      - key: AUTH_SECRET
        generateValue: true

      # NextAuth needs to know it is behind Render's proxy.
      - key: AUTH_TRUST_HOST
        value: "true"

      # Where updates are pulled FROM. Without it, the Version screen falls back
      # to the publisher's own registry, where your credentials do not work — the
      # pull command it prints looks correct and returns 403. You find out on the
      # day you try to update.
      - key: LICENCE_REGISTRY_HOST
        value: registry.lasersite.ai

      # Public origin. Render injects RENDER_EXTERNAL_URL and the app reads it,
      # so this is only needed for a custom domain — hence commented out.
      # - key: APP_URL
      #   value: https://your-domain.com

      - key: NODE_ENV
        value: production
